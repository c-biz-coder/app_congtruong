name: Deploy

on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web admin
        run: pnpm --filter @partner-os/web build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # TODO(ops): switch this placeholder to your real host
      # (e.g. Supabase Hosting, Vercel, or a S3 + CDN upload).
      - name: Note deployment target
        run: echo "Web build ready for release ${{ github.ref_name }}."

  # TODO(ops): EAS builds require authenticated EAS_CLI_PROJECT_ID / secrets.
